# Stand-alone OIDC issuer endpoint: serves the discovery document and JWKS that
# the bootstrap step pulled out of the cluster and rewrote to point here. This
# is what a real workload-identity-federation setup looks like — the metadata is
# published somewhere stable and public, decoupled from the API server.

server {
    listen 443 ssl;
    server_name issuer-web;

    ssl_certificate     /oidc/tls.crt;
    ssl_certificate_key /oidc/tls.key;

    location = /.well-known/openid-configuration {
        default_type application/json;
        alias /oidc/openid-configuration.json;
    }

    location = /openid/v1/jwks {
        default_type application/json;
        alias /oidc/jwks.json;
    }

    location / {
        return 404;
    }
}

# Plain-HTTP endpoint used only by the container healthcheck.
server {
    listen 80;
    location = /healthz {
        return 200 "ok\n";
    }
}
