# Stand-alone OIDC issuer endpoint, outside the cluster.
#
# Read side (public): serves the discovery document and the JWKS over HTTPS with a
# serving certificate from the internal PKI. GET/HEAD only.
#
# Write side (cluster-net only): the in-cluster JWKS publisher pushes both
# documents with PUT. Only a client certificate issued by the internal CA with
# CN=jwks-publisher may write; every upload is logged with the client's DN.
# Documents are stored under their URL path so both sides share one layout.

# Upload rights are bound to the publisher's exact subject DN (RFC 2253 form),
# not to a substring of it.
map $ssl_client_s_dn $publisher_ok {
    "CN=jwks-publisher,O=WIF Lab" 1;
    default                       0;
}

log_format upload '$time_iso8601 $remote_addr "$request" $status '
                  'client_dn="$ssl_client_s_dn" verify=$ssl_client_verify';

server {
    listen 443 ssl;
    server_name issuer-web;

    ssl_certificate     /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;

    root /oidc;

    location = /.well-known/openid-configuration {
        limit_except GET { deny all; }
        default_type application/json;
    }

    location = /openid/v1/jwks {
        limit_except GET { deny all; }
        default_type application/json;
    }

    location / {
        return 404;
    }
}

server {
    listen 172.31.7.20:8443 ssl;
    server_name issuer-web;

    ssl_certificate         /tls/tls.crt;
    ssl_certificate_key     /tls/tls.key;
    ssl_client_certificate  /trust/ca.crt;
    ssl_verify_client       on;
    ssl_verify_depth        1;

    access_log /var/log/nginx/access.log upload;

    root /oidc;
    client_body_temp_path /oidc/.tmp;
    client_max_body_size  64k;

    location = /.well-known/openid-configuration {
        if ($publisher_ok = 0) { return 403; }
        limit_except PUT { deny all; }
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:r all:r;
    }

    location = /openid/v1/jwks {
        if ($publisher_ok = 0) { return 403; }
        limit_except PUT { deny all; }
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:r all:r;
    }

    location / {
        return 404;
    }
}
