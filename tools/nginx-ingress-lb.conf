# Stand-in for the load balancer in front of the cluster's ingress nodes.
# Passes TCP 443 from relying-net through to Traefik's node port on cluster-net.
# TLS ends at the ingress inside the cluster; this hop sees ciphertext only.
# Nothing else of the cluster is reachable through it.

worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

stream {
    log_format edge '$time_iso8601 $remote_addr -> $upstream_addr $status $bytes_sent/$bytes_received';
    access_log /dev/stdout edge;

    server {
        listen 172.31.8.20:443;
        proxy_pass 172.31.7.2:30443;
        proxy_connect_timeout 5s;
    }
}
