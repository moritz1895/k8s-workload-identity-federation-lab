# Workload-facing gateway of the domain authorization server.
#
# Workloads reach Keycloak only through this gateway (workload-net), and only the
# public endpoints of the domain realm: discovery, token, certs. The admin console
# and admin REST API (/admin), the master realm and every other realm, and the
# management interface stay unreachable from the workload network.
#
# The gateway terminates TLS with Keycloak's own certificate (name `keycloak`), so
# the realm issuer URL is the same on both sides, and re-encrypts to Keycloak on
# relying-net, verifying it against the internal CA.

server {
    listen 8443 ssl;
    server_name keycloak;

    ssl_certificate     /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;

    # proxy_pass carries a URI, so nginx forwards the normalised path:
    # /realms/domain-rst/../master/... cannot escape the realm prefix.
    location /realms/domain-rst/ {
        limit_except GET POST {
            deny all;
        }
        proxy_pass https://keycloak:8443/realms/domain-rst/;
        proxy_set_header Host keycloak:8443;
        proxy_ssl_trusted_certificate /trust/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_name keycloak;
        proxy_ssl_server_name on;
    }

    location / {
        return 404;
    }
}
