# Admin console access to Keycloak from the host (compose profile `admin`).
#
# Keycloak itself publishes no host port: a published container port is reachable
# from the other bridge networks as well, which would hand the workloads the admin
# API. This proxy is started only while someone administers the realm, published on
# 127.0.0.1 only. While it runs, its port is reachable from the workload network
# for the same reason — stop it again afterwards (`docker compose stop keycloak-admin`).

server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;

    location / {
        proxy_pass https://keycloak:8443;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_ssl_trusted_certificate /trust/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_name keycloak;
        proxy_ssl_server_name on;
    }
}
