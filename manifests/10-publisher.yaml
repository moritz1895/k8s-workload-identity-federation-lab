# In-cluster JWKS publisher. Reads the cluster's discovery document and JWKS with
# its own ServiceAccount (read-only discovery role, no admin rights) and pushes
# them over mTLS to the external issuer endpoint whenever they change.
# Towards issuer-web it authenticates with a client certificate from the internal
# PKI — never with a ServiceAccount token, which would be checked against the very
# keys it publishes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jwks-publisher
  namespace: wif-publisher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jwks-publisher-issuer-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - kind: ServiceAccount
    name: jwks-publisher
    namespace: wif-publisher
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jwks-publisher-script
  namespace: wif-publisher
data:
  publish.sh: |
    #!/bin/sh
    # Each round compares the cluster's discovery document + JWKS with what the
    # issuer currently serves and uploads on any difference. Logs which kids
    # appeared or vanished, and warns when the issuer serves something this
    # publisher did not upload.
    set -u
    SA=/var/run/secrets/kubernetes.io/serviceaccount
    API=https://kubernetes.default.svc
    TARGET="${PUBLISH_TARGET:-https://issuer-web:8443}"
    PUBLIC_URL="${PUBLIC_URL:-https://issuer-web}"
    INTERVAL="${PUBLISH_INTERVAL_SECONDS:-15}"
    WORK=/tmp/publisher
    mkdir -p "$WORK"
    uploaded_hash=""

    fetch() {
      printf 'Authorization: Bearer %s\n' "$(cat "$SA/token")" > "$WORK/auth-header"
      curl -fsS --max-time 10 --cacert "$SA/ca.crt" -H "@$WORK/auth-header" "$API$1" -o "$2"
    }

    upload() {
      curl -fsS --max-time 10 --cacert /trust/ca.crt \
        --cert /mtls/tls.crt --key /mtls/tls.key \
        -H 'Content-Type: application/json' -T "$2" "$TARGET$1" -o /dev/null
    }

    kids_of() {
      grep -o '"kid":"[^"]*"' "$1" | cut -d'"' -f4 | sort | tr '\n' ' '
    }

    read_published() {
      curl -fsS --max-time 10 --cacert /trust/ca.crt "$PUBLIC_URL$1" -o "$2"
    }

    hash_of() {
      cat "$1" "$2" | sha256sum | cut -d' ' -f1
    }

    while true; do
      if fetch /.well-known/openid-configuration "$WORK/discovery.json" \
         && fetch /openid/v1/jwks "$WORK/jwks.json"; then
        hash=$(hash_of "$WORK/discovery.json" "$WORK/jwks.json")
        served_hash=""
        served_kids=""
        if read_published /.well-known/openid-configuration "$WORK/served-discovery.json" \
           && read_published /openid/v1/jwks "$WORK/served-jwks.json"; then
          served_hash=$(hash_of "$WORK/served-discovery.json" "$WORK/served-jwks.json")
          served_kids=$(kids_of "$WORK/served-jwks.json")
        fi
        if [ "$hash" != "$served_hash" ]; then
          if [ -n "$uploaded_hash" ] && [ "$served_hash" != "$uploaded_hash" ]; then
            echo "publisher: WARNING issuer serves content this publisher did not upload (sha256=${served_hash:-none} kids=[ $served_kids]), restoring" >&2
          fi
          if upload /openid/v1/jwks "$WORK/jwks.json" \
             && upload /.well-known/openid-configuration "$WORK/discovery.json"; then
            echo "publisher: published JWKS sha256=$hash kids=[ $(kids_of "$WORK/jwks.json")] previous=[ $served_kids]"
            uploaded_hash="$hash"
          else
            echo "publisher: upload failed, retrying in ${INTERVAL}s" >&2
          fi
        fi
      else
        echo "publisher: reading from the API server failed, retrying in ${INTERVAL}s" >&2
      fi
      sleep "$INTERVAL"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwks-publisher
  namespace: wif-publisher
  labels:
    app: jwks-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jwks-publisher
  template:
    metadata:
      labels:
        app: jwks-publisher
    spec:
      serviceAccountName: jwks-publisher
      # issuer-web lives outside the cluster; CoreDNS does not know it, so the
      # name is pinned to its upload address on cluster-net.
      hostAliases:
        - ip: "172.31.7.20"
          hostnames:
            - issuer-web
      containers:
        - name: publisher
          image: curlimages/curl:8.11.1
          command: ["sh", "/scripts/publish.sh"]
          env:
            - name: PUBLISH_INTERVAL_SECONDS
              value: "15"
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: mtls
              mountPath: /mtls
              readOnly: true
            - name: trust
              mountPath: /trust
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: jwks-publisher-script
        - name: mtls
          secret:
            secretName: jwks-publisher-mtls
        - name: trust
          configMap:
            name: internal-ca
