apiVersion: v1
kind: ServiceAccount
metadata:
  name: consumer
  namespace: wif-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: wif-demo
  labels:
    app: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      serviceAccountName: consumer
      automountServiceAccountToken: false
      # The validator lives outside the cluster on the shared Docker network at a
      # fixed IP. CoreDNS knows nothing about it, so we pin the name here.
      hostAliases:
        - ip: "172.31.7.10"
          hostnames:
            - validator.wif.local
      containers:
        - name: consumer
          image: curlimages/curl:8.11.1
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
      volumes:
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  # audience is bound into the token's `aud` claim; the validator
                  # rejects anything that is not exactly this value.
                  audience: wif-demo-validator
                  expirationSeconds: 600
                  path: sa-token
