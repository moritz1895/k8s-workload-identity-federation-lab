# Configures the gateway controller k3s ships (Traefik); the chart creates the
# GatewayClass `traefik`:
#   - Service type NodePort with a fixed port; kube-proxy opens node ports only on the
#     cluster-net address (--nodeport-addresses), where ingress-lb forwards to them
#   - only the HTTPS entry point is exposed
#   - routes come only from the Gateway API (Gateway + HTTPRoute): the Ingress provider
#     and Traefik's own CRDs (IngressRoute & co.) are switched off, so the admission
#     policies in 05-issuer-discovery-admission.yaml cover every route
#   - no default Gateway from the chart; each Gateway is created explicitly
#   - strict SNI: a TLS handshake for a host without a configured certificate fails
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        type: NodePort
    ports:
      web:
        expose:
          default: false
      websecure:
        nodePort: 30443
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        enabled: false
      kubernetesGateway:
        enabled: true
      file:
        enabled: true
        content: |
          tls:
            options:
              default:
                sniStrict: true
                minVersion: VersionTLS12
    gateway:
      enabled: false
    gatewayClass:
      enabled: true
      name: traefik
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
