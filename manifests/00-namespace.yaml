apiVersion: v1
kind: Namespace
metadata:
  name: wif-demo
---
# Holds the issuer discovery endpoint. Write access only for cluster admins / the
# GitOps process; no RoleBinding grants anything in here.
apiVersion: v1
kind: Namespace
metadata:
  name: wif-issuer-discovery
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
