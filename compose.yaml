name: wif-lab

networks:
  wifnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.7.0/24

volumes:
  k3s-data:
  kubeconfig:
  oidc-web:

services:
  # Single-node k3s, running straight in a container (no k3d binary on the host).
  # The ServiceAccount issuer is a URL served by a stand-alone endpoint, not the
  # API server itself — see the `issuer-web` service.
  server:
    image: ${K3S_IMAGE:-rancher/k3s:v1.34.11-k3s1}
    command:
      - server
      - --disable=traefik
      - --disable=servicelb
      - --disable=metrics-server
      - --tls-san=k3s-server
      - --kube-apiserver-arg=service-account-issuer=https://issuer-web
      - --kube-apiserver-arg=service-account-jwks-uri=https://issuer-web/openid/v1/jwks
    privileged: true
    tmpfs:
      - /run
      - /var/run
    environment:
      - K3S_TOKEN=${K3S_TOKEN:-lab-not-a-secret-change-me}
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=644
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - kubeconfig:/output
    networks:
      wifnet:
        aliases:
          - k3s-server
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw", "/readyz"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  # One-shot: applies the lab manifests and publishes the cluster's OIDC
  # discovery document + JWKS into the oidc-web volume, then exits.
  bootstrap:
    build:
      context: ./tools
    image: wif-lab/tools
    entrypoint: ["bash", "/work/bootstrap.sh"]
    restart: "no"
    volumes:
      - kubeconfig:/kube:ro
      - oidc-web:/oidc
      - ./manifests:/manifests:ro
      - ./tools:/work:ro
    networks:
      - wifnet
    depends_on:
      server:
        condition: service_healthy

  # Stand-alone OIDC issuer endpoint. This is the URL in the token's `iss` claim;
  # the validator does discovery against it and never touches the API server.
  issuer-web:
    image: nginx:alpine
    volumes:
      - oidc-web:/oidc:ro
      - ./tools/nginx-issuer.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      wifnet:
        aliases:
          - issuer-web
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # The "foreign" service: NOT in the cluster. Validates the pod's JWT offline —
  # OIDC discovery against issuer-web, then signature + iss + aud + exp (Nimbus).
  validator:
    build:
      context: ./validator
    image: wif-lab/validator
    environment:
      - WIF_ISSUER=${WIF_ISSUER:-https://issuer-web}
      - WIF_AUDIENCE=${WIF_AUDIENCE:-wif-demo-validator}
      - WIF_ISSUER_CA=/oidc/tls.crt
    volumes:
      - oidc-web:/oidc:ro
    networks:
      wifnet:
        ipv4_address: 172.31.7.10
    # Optional: expose the validator on the host for manual pokes (curl).
    ports:
      - "${VALIDATOR_HOST_PORT:-18080}:8080"
    depends_on:
      issuer-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  # On-demand verification harness: docker compose run --rm demo
  demo:
    build:
      context: ./tools
    image: wif-lab/tools
    environment:
      - WIF_AUDIENCE=${WIF_AUDIENCE:-wif-demo-validator}
      - VALIDATOR_URL=http://validator:8080
    volumes:
      - kubeconfig:/kube:ro
      - oidc-web:/oidc:ro
      - ./tools:/work:ro
    networks:
      - wifnet
    depends_on:
      validator:
        condition: service_healthy
    profiles:
      - demo
    entrypoint: ["bash", "/work/demo.sh"]
