name: wif-lab

# Three separate trust / network zones:
#   cluster-net  — the cluster and the one way out of it: the issuer's upload listener
#   relying-net  — the issuer's public read listener and the relying party (validator)
#   workload-net — the path workloads in the cluster use to call the validator
# The validator never shares a network with the API server's listener, and no
# volume is shared between the cluster side and the validator.
networks:
  cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.7.0/24
  relying-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.8.0/24
  workload-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.9.0/24

volumes:
  k3s-data:
  kubeconfig:
  sa-keys:
  oidc-web:
  pki-ca:
  ca-trust:
  issuer-tls:
  publisher-tls:
  pki-demo:
  demo-state:

services:
  # One-shot lab PKI, the stand-in for the internal PKI. In a real setup the
  # root certificate is already distributed to every system that needs it.
  pki-init:
    build:
      context: ./tools
    image: wif-lab/tools
    entrypoint: ["bash", "/work/pki-init.sh"]
    restart: "no"
    network_mode: none
    volumes:
      - pki-ca:/pki/ca
      - ca-trust:/pki/trust
      - issuer-tls:/pki/issuer
      - publisher-tls:/pki/publisher
      - pki-demo:/pki/demo
      - ./tools:/work:ro

  # ServiceAccount signing keys. `docker compose run --rm sa-keys rotate` rotates.
  sa-keys:
    build:
      context: ./tools
    image: wif-lab/tools
    entrypoint: ["bash", "/work/sa-keys.sh"]
    command: ["init"]
    restart: "no"
    network_mode: none
    volumes:
      - sa-keys:/sa-keys
      - ./tools:/work:ro

  # Single-node k3s. Tokens carry iss=https://issuer-web; the API server listens
  # only on its cluster-net address.
  server:
    image: ${K3S_IMAGE:-rancher/k3s:v1.34.11-k3s1}
    command:
      - server
      - --disable=traefik
      - --disable=servicelb
      - --disable=metrics-server
      - --tls-san=k3s-server
      - --node-ip=172.31.7.2
      - --advertise-address=172.31.7.2
      - --bind-address=172.31.7.2
      - --kube-apiserver-arg=service-account-issuer=https://issuer-web
      - --kube-apiserver-arg=service-account-jwks-uri=https://issuer-web/openid/v1/jwks
      - --kube-apiserver-arg=service-account-signing-key-file=/sa-keys/signing.key
      - --kube-apiserver-arg=service-account-key-file=/sa-keys/verify.pub
    privileged: true
    tmpfs:
      - /run
      - /var/run
    environment:
      - K3S_TOKEN=${K3S_TOKEN:-lab-not-a-secret-change-me}
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=644
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - kubeconfig:/output
      - sa-keys:/sa-keys:ro
    networks:
      cluster-net:
        ipv4_address: 172.31.7.2
        aliases:
          - k3s-server
      workload-net:
        ipv4_address: 172.31.9.2
    depends_on:
      sa-keys:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw", "/readyz"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  # One-shot cluster setup with the admin kubeconfig: applies the manifests and
  # hands the publisher its client certificate and the CA as Secret / ConfigMap.
  # It never touches the issuer endpoint.
  bootstrap:
    build:
      context: ./tools
    image: wif-lab/tools
    entrypoint: ["bash", "/work/bootstrap.sh"]
    restart: "no"
    volumes:
      - kubeconfig:/kube:ro
      - ca-trust:/trust:ro
      - publisher-tls:/publisher-tls:ro
      - ./manifests:/manifests:ro
      - ./tools:/work:ro
    networks:
      - cluster-net
    depends_on:
      server:
        condition: service_healthy
      pki-init:
        condition: service_completed_successfully

  # Stand-alone OIDC issuer endpoint, outside the cluster.
  #   :443  on every address — public, read-only discovery document + JWKS
  #         (the validator reads it via relying-net, the publisher via cluster-net)
  #   :8443 on cluster-net — mTLS upload, only for the jwks-publisher certificate
  # Healthy once the publisher has uploaded the first JWKS.
  issuer-web:
    image: ${NGINX_IMAGE:-nginx:1.29-alpine}
    entrypoint: ["sh", "-c", "mkdir -p /oidc/.tmp && chown -R nginx:nginx /oidc && exec nginx -g 'daemon off;'"]
    volumes:
      - oidc-web:/oidc
      - issuer-tls:/tls:ro
      - ca-trust:/trust:ro
      - ./tools/nginx-issuer.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      cluster-net:
        ipv4_address: 172.31.7.20
      relying-net:
        ipv4_address: 172.31.8.20
        aliases:
          - issuer-web
    depends_on:
      pki-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-s", "/oidc/openid/v1/jwks"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  # The relying party: NOT in the cluster. Trusts the internal CA, does OIDC
  # discovery against issuer-web and validates pod tokens offline (Nimbus).
  validator:
    build:
      context: ./validator
    image: wif-lab/validator
    environment:
      - WIF_ISSUER=${WIF_ISSUER:-https://issuer-web}
      - WIF_AUDIENCE=${WIF_AUDIENCE:-wif-demo-validator}
      - WIF_ISSUER_CA=/trust/ca.crt
    volumes:
      - ca-trust:/trust:ro
    networks:
      relying-net:
        ipv4_address: 172.31.8.10
      workload-net:
        ipv4_address: 172.31.9.10
    ports:
      - "${VALIDATOR_HOST_PORT:-18080}:8080"
    depends_on:
      issuer-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  # Negative check: the validator configured with a foreign CA must refuse to
  # start. docker compose run --rm validator-foreign-ca  (expected: non-zero exit)
  validator-foreign-ca:
    image: wif-lab/validator
    environment:
      - WIF_ISSUER=${WIF_ISSUER:-https://issuer-web}
      - WIF_AUDIENCE=${WIF_AUDIENCE:-wif-demo-validator}
      - WIF_ISSUER_CA=/pki-demo/foreign-ca.crt
    volumes:
      - pki-demo:/pki-demo:ro
    networks:
      - relying-net
    profiles:
      - negative
    restart: "no"

  # Verification harness: docker compose run --rm demo [all|pre-rotation|post-rotation]
  demo:
    build:
      context: ./tools
    image: wif-lab/tools
    environment:
      - WIF_AUDIENCE=${WIF_AUDIENCE:-wif-demo-validator}
      - VALIDATOR_URL=http://validator:8080
    volumes:
      - kubeconfig:/kube:ro
      - ca-trust:/trust:ro
      - pki-demo:/pki-demo:ro
      - demo-state:/state
      - ./tools:/work:ro
    networks:
      - cluster-net
      - relying-net
    depends_on:
      validator:
        condition: service_healthy
    profiles:
      - demo
    entrypoint: ["bash", "/work/demo.sh"]
    command: ["all"]
