name: wif-lab

# Three separate trust / network zones:
#   cluster-net  — the cluster node; the API server and the ingress node port listen
#                  only on its address here
#   relying-net  — the relying parties (validator, keycloak, service-r) and the one
#                  way into the cluster: ingress-lb, which passes only TCP 443 on to
#                  the ingress route of the issuer pod
#   workload-net — the path workloads in the cluster use to call validator,
#                  keycloak and service-r
# No relying party shares a network with the API server's listener, and no
# volume is shared between the cluster side and the relying parties.
networks:
  cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.7.0/24
  relying-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.8.0/24
  workload-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.9.0/24

volumes:
  k3s-data:
  kubeconfig:
  sa-keys:
  pki-ca:
  ca-trust:
  issuer-tls:
  keycloak-tls:
  service-r-tls:
  validator-tls:
  pki-demo:
  demo-state:

services:
  # One-shot lab PKI, the stand-in for the internal PKI. In a real setup the
  # root certificate is already distributed to every system that needs it.
  pki-init:
    build:
      context: ./tools
    image: wif-lab/tools
    entrypoint: ["bash", "/work/pki-init.sh"]
    restart: "no"
    network_mode: none
    volumes:
      - pki-ca:/pki/ca
      - ca-trust:/pki/trust
      - issuer-tls:/pki/issuer
      - keycloak-tls:/pki/keycloak
      - service-r-tls:/pki/service-r
      - validator-tls:/pki/validator
      - pki-demo:/pki/demo
      - ./tools:/work:ro

  # ServiceAccount signing keys. A key change runs in two phases, each followed by
  # `docker compose restart server`:
  #   docker compose run --rm sa-keys stage      (new key published ahead, does not sign yet)
  #   docker compose run --rm sa-keys activate   (new key signs, once it is served)
  sa-keys:
    build:
      context: ./tools
    image: wif-lab/tools
    entrypoint: ["bash", "/work/sa-keys.sh"]
    command: ["init"]
    restart: "no"
    network_mode: none
    volumes:
      - sa-keys:/sa-keys
      - ./tools:/work:ro

  # Single-node k3s with its bundled ingress controller (Traefik, configured in
  # manifests/01-traefik-config.yaml). Tokens carry iss=https://issuer.wif.local, the
  # ingress host of the in-cluster issuer pod. The API server and the node ports
  # listen only on the cluster-net address.
  server:
    image: ${K3S_IMAGE:-rancher/k3s:v1.34.11-k3s1}
    command:
      - server
      - --disable=servicelb
      - --disable=metrics-server
      - --tls-san=k3s-server
      - --node-ip=172.31.7.2
      - --advertise-address=172.31.7.2
      - --bind-address=172.31.7.2
      - --kube-proxy-arg=nodeport-addresses=172.31.7.0/24
      - --kube-apiserver-arg=service-account-issuer=https://issuer.wif.local
      - --kube-apiserver-arg=service-account-jwks-uri=https://issuer.wif.local/openid/v1/jwks
      - --kube-apiserver-arg=service-account-signing-key-file=/sa-keys/signing.key
      - --kube-apiserver-arg=service-account-key-file=/sa-keys/verify.pub
    privileged: true
    tmpfs:
      - /run
      - /var/run
    environment:
      - K3S_TOKEN=${K3S_TOKEN:-lab-not-a-secret-change-me}
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=644
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - kubeconfig:/output
      - sa-keys:/sa-keys:ro
    networks:
      cluster-net:
        ipv4_address: 172.31.7.2
        aliases:
          - k3s-server
      workload-net:
        ipv4_address: 172.31.9.2
    depends_on:
      sa-keys:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw", "/readyz"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  # One-shot cluster setup with the admin kubeconfig: applies the manifests and
  # hands the ingress its serving certificate and the workloads the CA as
  # Secret / ConfigMap.
  bootstrap:
    build:
      context: ./tools
    image: wif-lab/tools
    entrypoint: ["bash", "/work/bootstrap.sh"]
    restart: "no"
    volumes:
      - kubeconfig:/kube:ro
      - ca-trust:/trust:ro
      - issuer-tls:/issuer-tls:ro
      - ./manifests:/manifests:ro
      - ./tools:/work:ro
    networks:
      - cluster-net
    depends_on:
      server:
        condition: service_healthy
      pki-init:
        condition: service_completed_successfully

  # Stand-in for the load balancer in front of the ingress nodes: the relying
  # parties' only way into the cluster. Listens on relying-net and passes TCP 443
  # through to Traefik's node port on cluster-net. Healthy once the issuer pod
  # serves the JWKS through the ingress. It is the only container in both
  # relying-net and cluster-net, hence locked down: read-only, only the
  # capabilities nginx needs to bind 443 and drop to its worker user.
  ingress-lb:
    image: ${NGINX_IMAGE:-nginx:1.29-alpine}
    command: ["nginx", "-c", "/etc/nginx/ingress-lb.conf", "-g", "daemon off;"]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE", "SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ca-trust:/trust:ro
      - ./tools/nginx-ingress-lb.conf:/etc/nginx/ingress-lb.conf:ro
    networks:
      cluster-net:
        ipv4_address: 172.31.7.20
      relying-net:
        ipv4_address: 172.31.8.20
        aliases:
          - issuer.wif.local
    mem_limit: 32m
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--cacert", "/trust/ca.crt",
             "--resolve", "issuer.wif.local:443:172.31.8.20", "https://issuer.wif.local/openid/v1/jwks"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s

  # The relying party: NOT in the cluster. Trusts the internal CA, does OIDC
  # discovery against issuer.wif.local and validates pod tokens offline (Nimbus).
  # HTTPS only (8443) with a serving certificate from the internal PKI.
  validator:
    build:
      context: ./validator
    image: wif-lab/validator
    environment:
      - WIF_ISSUER=${WIF_ISSUER:-https://issuer.wif.local}
      - WIF_AUDIENCE=${WIF_AUDIENCE:-wif-demo-validator}
      - WIF_ISSUER_CA=/trust/ca.crt
      - VALIDATOR_TLS_DIR=/tls
    volumes:
      - ca-trust:/trust:ro
      - validator-tls:/tls:ro
    networks:
      relying-net:
        ipv4_address: 172.31.8.10
      workload-net:
        ipv4_address: 172.31.9.10
    ports:
      - "127.0.0.1:${VALIDATOR_HOST_PORT:-18080}:8443"
    depends_on:
      ingress-lb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/trust/ca.crt", "https://localhost:8443/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  # Negative check: the validator configured with a foreign CA must refuse to
  # start. docker compose run --rm validator-foreign-ca  (expected: non-zero exit)
  validator-foreign-ca:
    image: wif-lab/validator
    environment:
      - WIF_ISSUER=${WIF_ISSUER:-https://issuer.wif.local}
      - WIF_AUDIENCE=${WIF_AUDIENCE:-wif-demo-validator}
      - WIF_ISSUER_CA=/pki-demo/foreign-ca.crt
      - VALIDATOR_TLS_DIR=/tls
    volumes:
      - pki-demo:/pki-demo:ro
      - validator-tls:/tls:ro
    networks:
      - relying-net
    profiles:
      - negative
    restart: "no"

  # Authorization server of the domain that owns R, S and T. Production start mode,
  # HTTPS only, but single node with the embedded file database (lab only).
  # Accepts the cluster's ServiceAccount tokens as client assertions (Kubernetes
  # identity provider `lab-cluster`, keys from issuer.wif.local) and issues access
  # tokens whose scopes are the realm's client-scope assignments.
  # Only on relying-net: workloads reach it through keycloak-gateway, which exposes
  # nothing but the domain realm's public endpoints. Admin console on the host only.
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.2}
    command: ["start", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD:-lab-not-a-secret-change-me}
      - KC_HOSTNAME=https://keycloak:8443
      - KC_HOSTNAME_ADMIN=https://localhost:${KEYCLOAK_HOST_PORT:-18443}
      - KC_DB=dev-file
      - KC_HTTP_ENABLED=false
      - KC_HTTPS_CERTIFICATE_FILE=/tls/tls.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/tls/tls.key
      - KC_TRUSTSTORE_PATHS=/trust/ca.crt
      - KC_CACHE=local
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_MANAGEMENT_SCHEME=http
      - KC_FEATURES_DISABLED=identity-brokering-api,twitter-broker
      - KC_SPI_STICKY_SESSION_ENCODER__INFINISPAN__SHOULD_ATTACH_ROUTE=false
      - JAVA_OPTS_KC_HEAP=-XX:MaxRAMPercentage=70
    volumes:
      - keycloak-tls:/tls:ro
      - ca-trust:/trust:ro
      - ./keycloak/realm-domain-rst.json:/opt/keycloak/data/import/realm-domain-rst.json:ro
    networks:
      relying-net:
        ipv4_address: 172.31.8.30
        aliases:
          - keycloak
    # No published port: Docker makes a published container port reachable from
    # the other bridge networks too, which would expose the admin API to workloads.
    mem_limit: 1g
    depends_on:
      pki-init:
        condition: service_completed_successfully
      ingress-lb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The workloads' only way to Keycloak: forwards /realms/domain-rst/ (discovery,
  # token, certs) and answers 404 for everything else (admin API, master realm).
  # Presents Keycloak's certificate, so pods use the same issuer URL as R.
  keycloak-gateway:
    image: ${NGINX_IMAGE:-nginx:1.29-alpine}
    volumes:
      - keycloak-tls:/tls:ro
      - ca-trust:/trust:ro
      - ./tools/nginx-keycloak-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      relying-net:
        ipv4_address: 172.31.8.31
      workload-net:
        ipv4_address: 172.31.9.30
    mem_limit: 64m
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8443"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Admin console from the host, only on demand:
  #   docker compose --profile admin up -d keycloak-admin   ->  https://localhost:18443/admin/
  #   docker compose stop keycloak-admin
  # While it runs, its published port is reachable from the workload network too.
  keycloak-admin:
    image: ${NGINX_IMAGE:-nginx:1.29-alpine}
    volumes:
      - keycloak-tls:/tls:ro
      - ca-trust:/trust:ro
      - ./tools/nginx-keycloak-admin.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      relying-net:
        ipv4_address: 172.31.8.32
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-18443}:8443"
    mem_limit: 64m
    depends_on:
      keycloak:
        condition: service_healthy
    profiles:
      - admin

  # Resource server R of the domain: a plain Spring Security resource server.
  # HTTPS only (8443) with a serving certificate from the internal PKI.
  # Trusts only access tokens of the domain realm addressed to service-r alone
  # and maps their scopes to authorities; it knows no workload names.
  service-r:
    build:
      context: ./service-r
    image: wif-lab/service-r
    environment:
      - KC_REALM_ISSUER=${KC_REALM_ISSUER:-https://keycloak:8443/realms/domain-rst}
      - SERVICE_R_AUDIENCE=${SERVICE_R_AUDIENCE:-service-r}
      - SERVICE_R_TRUST_CA=/trust/ca.crt
      - SERVICE_R_TLS_DIR=/tls
    volumes:
      - ca-trust:/trust:ro
      - service-r-tls:/tls:ro
    networks:
      relying-net:
        ipv4_address: 172.31.8.40
      workload-net:
        ipv4_address: 172.31.9.40
    ports:
      - "127.0.0.1:${SERVICE_R_HOST_PORT:-18081}:8443"
    mem_limit: 384m
    depends_on:
      pki-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/trust/ca.crt", "https://localhost:8443/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Verification harness:
  #   docker compose run --rm demo [all|authz|hardening|resilience|pre-rotation|staged|post-rotation]
  demo:
    build:
      context: ./tools
    image: wif-lab/tools
    environment:
      - WIF_AUDIENCE=${WIF_AUDIENCE:-wif-demo-validator}
      - VALIDATOR_URL=https://validator:8443
      - KC_REALM_ISSUER=${KC_REALM_ISSUER:-https://keycloak:8443/realms/domain-rst}
    volumes:
      - kubeconfig:/kube:ro
      - ca-trust:/trust:ro
      - pki-demo:/pki-demo:ro
      - demo-state:/state
      - ./tools:/work:ro
    networks:
      - cluster-net
      - relying-net
    depends_on:
      validator:
        condition: service_healthy
      service-r:
        condition: service_healthy
      keycloak-gateway:
        condition: service_healthy
    profiles:
      - demo
    entrypoint: ["bash", "/work/demo.sh"]
    command: ["all"]
